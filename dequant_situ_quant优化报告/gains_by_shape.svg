<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">最终累计时延收益（%，NPUGraph）</title>
<desc id="desc">基线到最终态的时延下降幅度，按收益排序，单色蓝（同一度量）。routed decode 82.9%（5.8 倍）来自行级负载再分配；routed 与 bf16、shared 多行 shape 收益 12.6% 至 20.7%；shared 2H=12288（UB 不足以双缓冲）收益 4.9% 至 5.2%，全部来自 R1 消 pass。rows 小于等于 16 的各档处于正负 8% 噪声带，未列入本图。</desc>
<style>.t{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}</style>
