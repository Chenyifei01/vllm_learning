<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">routed rows=16 每核 kernel 忙碌时间（msprof aiv_time，µs）</title>
<desc id="desc">routed decode（16 行、2H=6144、16 个激活核）优化前后每核的 kernel 忙碌时间。基线 block0 独扛 44.16µs（14 个 expert 串行），其余核 1.6 至 8.4µs；R4 行级均摊后 16 核全部 4.5 至 6.5µs，墙钟由 40.22 降至 6.89µs（NPUGraph）。两栏独立标尺。</desc>
