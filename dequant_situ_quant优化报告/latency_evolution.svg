<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">各轮次时延演进（NPUGraph，µs）</title>
<desc id="desc">dequant_situ_quant 三族生产 shape 在基线、R1（消冗余 pass）、R2（行间双缓冲）、R4（routed 行级再分配）下的 NPUGraph 时延，5 样本取中位。基线为空心描边柱，优化轮次按序数蓝阶加深。rows=16 的 routed decode 由 40.22 降至 6.89µs（-82.9%）；大 shape 收益 13% 至 21%；rows=65536 由 4400.47 降至 3495.33µs。</desc>
<style>.t{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}</style>
