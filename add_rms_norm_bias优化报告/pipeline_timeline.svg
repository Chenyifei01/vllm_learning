<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">行间流水示意</title>
  <desc id="desc">对比单核处理多行数据时的串行流程与流水流程。优化后，下一行装载与当前行向量计算重叠，当前行落盘与下一行计算重叠；装载 i+2 复用行 i 的槽位，须等落盘 i 完成后才能开始。</desc>
  <style>
    .surf { fill: #fcfcfb; }
    .ink { fill: #0b0b0b; }
    .ink2 { fill: #52514e; }
    .mut { fill: #777570; }
    .grid { stroke: #deddd6; stroke-width: 1; }
    .axis { stroke: #bbb9b0; stroke-width: 1; }
    .load { fill: #2a78d6; }
    .compute { fill: #eb6834; }
    .store { fill: #1baf7a; }
    .wait { fill: none; stroke: #aaa89f; stroke-width: 1; stroke-dasharray: 5 4; }
    .onbar { fill: #ffffff; }
    text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',Arial,sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surf { fill: #1a1a19; }
      .ink { fill: #ffffff; }
      .ink2 { fill: #d0cec6; }
      .mut { fill: #aaa89f; }
      .grid { stroke: #343431; }
      .axis { stroke: #55534d; }
      .load { fill: #3987e5; }
      .compute { fill: #d95926; }
      .store { fill: #199e70; }
      .wait { stroke: #77756e; }
    }
  </style>

  <rect class="surf" x="0" y="0" width="900" height="510"/>
  <text class="ink" x="24" y="30" font-size="15" font-weight="600">行间流水示意：装载、计算与落盘的重叠（单核）</text>
  <text class="ink2" x="24" y="52" font-size="12">块宽按实测量级绘制：装载约 0.5µs、计算约 1.7µs、落盘约 0.36µs/行</text>

  <text class="ink" x="24" y="84" font-size="13" font-weight="600">流水前：每行装载 → 计算 → 落盘，全程串行</text>
  <text class="ink2" x="24" y="122" font-size="12">MTE2 装载</text>
  <text class="ink2" x="24" y="162" font-size="12">V 计算</text>
  <text class="ink2" x="24" y="202" font-size="12">MTE3 落盘</text>
  <line class="grid" x1="130" y1="98" x2="860" y2="98"/>
  <line class="grid" x1="130" y1="218" x2="860" y2="218"/>

  <rect class="load" x="140" y="104" width="64" height="28" rx="3"/>
  <text class="onbar" x="172" y="122" font-size="11" text-anchor="middle">装载 i</text>
  <rect class="compute" x="204" y="144" width="214" height="28" rx="3"/>
  <text class="onbar" x="311" y="162" font-size="11" text-anchor="middle">计算 i</text>
  <rect class="store" x="418" y="184" width="52" height="28" rx="3"/>
  <text class="onbar" x="444" y="202" font-size="11" text-anchor="middle">落盘</text>

  <rect class="wait" x="204" y="104" width="266" height="28" rx="3"/>
  <text class="mut" x="337" y="122" font-size="10" text-anchor="middle">等待槽位释放</text>
  <rect class="load" x="470" y="104" width="64" height="28" rx="3"/>
  <text class="onbar" x="502" y="122" font-size="11" text-anchor="middle">装载 i+1</text>
  <rect class="compute" x="534" y="144" width="214" height="28" rx="3"/>
  <text class="onbar" x="641" y="162" font-size="11" text-anchor="middle">计算 i+1</text>
  <rect class="store" x="748" y="184" width="52" height="28" rx="3"/>
  <text class="onbar" x="774" y="202" font-size="11" text-anchor="middle">落盘</text>
  <text class="ink2" x="860" y="238" font-size="11" text-anchor="end">scalar_wait ≈ 85%</text>

  <line class="axis" x1="24" y1="250" x2="876" y2="250"/>

  <text class="ink" x="24" y="282" font-size="13" font-weight="600">流水后：装载 i+1 与计算 i 重叠，落盘 i 与计算 i+1 重叠</text>
  <text class="ink2" x="24" y="324" font-size="12">MTE2 装载</text>
  <text class="ink2" x="24" y="364" font-size="12">V 计算</text>
  <text class="ink2" x="24" y="404" font-size="12">MTE3 落盘</text>
  <line class="grid" x1="130" y1="298" x2="860" y2="298"/>
  <line class="grid" x1="130" y1="418" x2="860" y2="418"/>

  <rect class="load" x="140" y="306" width="64" height="28" rx="3"/>
  <text class="onbar" x="172" y="324" font-size="11" text-anchor="middle">装载 i</text>
  <rect class="load" x="204" y="306" width="64" height="28" rx="3"/>
  <text class="onbar" x="236" y="324" font-size="11" text-anchor="middle">装载 i+1</text>
  <rect class="wait" x="272" y="306" width="220" height="28" rx="3"/>
  <text class="mut" x="382" y="324" font-size="10" text-anchor="middle">装载 i+2 等落盘 i 释放槽位（MTE3_MTE2）</text>
  <rect class="load" x="496" y="306" width="64" height="28" rx="3"/>
  <text class="onbar" x="528" y="324" font-size="11" text-anchor="middle">装载 i+2</text>

  <rect class="compute" x="204" y="346" width="214" height="28" rx="3"/>
  <text class="onbar" x="311" y="364" font-size="11" text-anchor="middle">计算 i</text>
  <rect class="compute" x="418" y="346" width="214" height="28" rx="3"/>
  <text class="onbar" x="525" y="364" font-size="11" text-anchor="middle">计算 i+1</text>
  <rect class="compute" x="632" y="346" width="214" height="28" rx="3"/>
  <text class="onbar" x="739" y="364" font-size="11" text-anchor="middle">计算 i+2</text>

  <rect class="store" x="418" y="386" width="70" height="28" rx="3"/>
  <text class="onbar" x="453" y="404" font-size="11" text-anchor="middle">x/y i</text>
  <rect class="store" x="632" y="386" width="70" height="28" rx="3"/>
  <text class="onbar" x="667" y="404" font-size="11" text-anchor="middle">x/y i+1</text>
  <rect class="store" x="846" y="386" width="44" height="28" rx="3"/>
  <text class="onbar" x="868" y="404" font-size="10" text-anchor="middle">i+2</text>

  <text class="mut" x="236" y="344" font-size="10" text-anchor="middle">预取</text>
  <text class="ink2" x="860" y="438" font-size="11" text-anchor="end">scalar_wait ≈ 2%</text>
  <text class="mut" x="24" y="474" font-size="11">rstd 留在向量域（Gather + stride-0 广播），发射线程只发指令、不停等</text>
  <text class="ink2" x="24" y="495" font-size="11">scalar_wait：85% → 2%　　三线并行度：2.27 → 2.87</text>
</svg>
