<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" role="img" aria-label="行间流水示意：装载/计算/落盘的重叠（单核，2 行）">
  <style>
    .surf { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .mut { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; } .bline { stroke: #c3c2b7; stroke-width: 1; }
    .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; } .s3 { fill: #1baf7a; stroke: #1baf7a; }
    .s4 { fill: #eda100; stroke: #eda100; } .s5 { fill: #e87ba4; stroke: #e87ba4; }
    .neg { fill: #e34948; stroke: #e34948; }
    text { font-family: system-ui,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surf { fill: #1a1a19; } .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; } .mut { fill: #898781; }
      .grid { stroke: #2c2c2a; } .bline { stroke: #383835; }
      .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
      .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; }
      .neg { fill: #e66767; stroke: #e66767; }
    }
  </style>
<rect class="surf" x="0" y="0" width="860" height="470"/>
<text class="ink" x="24" y="30" font-size="15" font-weight="600">行间流水示意：装载/计算/落盘的重叠（单核，2 行）</text>

<text class="ink2" x="24" y="48" font-size="12" text-anchor="start">块宽 ∝ 实测量级（装载 0.5µs、计算 1.7µs、落盘 0.36µs/行）；等待块为发射线程停等</text>
<text class="ink" x="24" y="56" font-size="13" text-anchor="start" font-weight="600">流水前：每行 装载→计算→落盘 全串行</text>
<rect class="s1" x="40" y="66" width="60" height="30" rx="3"/>
<text x="70" y="85" font-size="11" fill="#fcfcfb" text-anchor="middle">载 x1/x2</text>
<rect class="s2" x="100" y="106" width="204" height="30" rx="3"/>
<text x="202" y="125" font-size="11" fill="#fcfcfb" text-anchor="middle">RMSNorm</text>
<rect x="304" y="66" width="60" height="30" fill="none" stroke-dasharray="3,3" class="bline"/>
<rect x="304" y="106" width="60" height="30" fill="none" stroke-dasharray="3,3" class="bline"/>
<text class="mut" x="334.0" y="108" font-size="10" text-anchor="middle">停等</text>
<rect class="s3" x="364" y="146" width="43" height="30" rx="3"/>
<rect class="s1" x="407" y="66" width="60" height="30" rx="3"/>
<text x="437" y="85" font-size="11" fill="#fcfcfb" text-anchor="middle">载 x1/x2</text>
<rect class="s2" x="467" y="106" width="204" height="30" rx="3"/>
<text x="569" y="125" font-size="11" fill="#fcfcfb" text-anchor="middle">RMSNorm</text>
<rect x="671" y="66" width="60" height="30" fill="none" stroke-dasharray="3,3" class="bline"/>
<rect x="671" y="106" width="60" height="30" fill="none" stroke-dasharray="3,3" class="bline"/>
<text class="mut" x="701.0" y="108" font-size="10" text-anchor="middle">停等</text>
<rect class="s3" x="731" y="146" width="43" height="30" rx="3"/>
<text class="ink2" x="24" y="85.0" font-size="12" text-anchor="start">MTE2 装载</text>
<text class="ink2" x="24" y="125.0" font-size="12" text-anchor="start">V 计算</text>
<text class="ink2" x="24" y="165.0" font-size="12" text-anchor="start">MTE3 落盘</text>
<text class="ink2" x="782" y="85.0" font-size="11" text-anchor="start">… 行 i+1 的装载</text>
<text class="ink2" x="782" y="125.0" font-size="11" text-anchor="start">要等行 i 全部完成</text>
<text class="ink2" x="836" y="162" font-size="11" text-anchor="end">scalar_wait ≈ 85%</text>
<text class="ink" x="24" y="280" font-size="13" text-anchor="start" font-weight="600">流水后：装载 i+1 与计算 i 重叠，落盘与下一行重叠</text>
<rect class="s1" x="40" y="296" width="60" height="30" rx="3"/>
<text x="70" y="315" font-size="11" fill="#fcfcfb" text-anchor="middle">载 i</text>
<rect class="s1" x="100" y="296" width="60" height="30" rx="3"/>
<text x="130" y="315" font-size="11" fill="#fcfcfb" text-anchor="middle">载 i+1</text>
<rect class="s1" x="160" y="296" width="60" height="30" rx="3"/>
<text x="190" y="315" font-size="11" fill="#fcfcfb" text-anchor="middle">载 i+2</text>
<rect class="s2" x="100" y="336" width="204" height="30" rx="3"/>
<text x="202" y="355" font-size="11" fill="#fcfcfb" text-anchor="middle">计算 i</text>
<rect class="s2" x="304" y="336" width="204" height="30" rx="3"/>
<text x="406" y="355" font-size="11" fill="#fcfcfb" text-anchor="middle">计算 i+1</text>
<rect class="s2" x="508" y="336" width="204" height="30" rx="3"/>
<text x="610" y="355" font-size="11" fill="#fcfcfb" text-anchor="middle">计算 i+2</text>
<rect class="s3" x="304" y="376" width="86" height="30" rx="3"/>
<text x="347" y="395" font-size="11" fill="#fcfcfb" text-anchor="middle">x/y i</text>
<rect class="s3" x="508" y="376" width="86" height="30" rx="3"/>
<text x="551" y="395" font-size="11" fill="#fcfcfb" text-anchor="middle">x/y i+1</text>
<rect class="s3" x="712" y="376" width="86" height="30" rx="3"/>
<text x="755" y="395" font-size="11" fill="#fcfcfb" text-anchor="middle">x/y i+2</text>
<text class="ink2" x="24" y="315.0" font-size="12" text-anchor="start">MTE2 装载</text>
<text class="ink2" x="24" y="355.0" font-size="12" text-anchor="start">V 计算</text>
<text class="ink2" x="24" y="395.0" font-size="12" text-anchor="start">MTE3 落盘</text>
<text class="mut" x="130.0" y="338" font-size="10" text-anchor="middle">预取</text>
<text class="ink2" x="836" y="392" font-size="11" text-anchor="end">scalar_wait ≈ 2%</text>
<text class="mut" x="24" y="446" font-size="11" text-anchor="start">rstd 全程留在向量域（Gather+stride-0 广播），发射线程只发指令、不停等：scalar_wait 85% → 2%，三线并行度 2.27 → 2.87</text>
</svg>