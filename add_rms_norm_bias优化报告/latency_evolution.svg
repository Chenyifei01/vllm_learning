<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">各版本时延演进</title>
  <desc id="desc">bf16、hidden 等于 7168 的 NPUGraph 测量结果。随着优化推进，2048 token 时延由 119.4 微秒降至 89.8 微秒，4096 token 由 250.9 微秒降至 183.7 微秒。</desc>
