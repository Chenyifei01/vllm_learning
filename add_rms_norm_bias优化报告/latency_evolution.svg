    .grid { stroke: #e1e0d9; stroke-width: 1; } .bline { stroke: #c3c2b7; stroke-width: 1; }
    .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; } .s3 { fill: #1baf7a; stroke: #1baf7a; }
    .s4 { fill: #eda100; stroke: #eda100; } .s5 { fill: #e87ba4; stroke: #e87ba4; }
    .neg { fill: #e34948; stroke: #e34948; }
    text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',Arial,sans-serif; }
    polyline { fill: none !important; }
    @media (prefers-color-scheme: dark) {
      .surf { fill: #1a1a19; } .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; } .mut { fill: #898781; }
      .grid { stroke: #2c2c2a; } .bline { stroke: #383835; }
      .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
      .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; }
      .neg { fill: #e66767; stroke: #e66767; }
    }
      .ring { stroke: #fcfcfb; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #1a1a19; } }
  </style>
