<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">最终版分档收益与回退风险</title>
  <desc id="desc">最终版相对基线的耗时变化率。prefill 各档 -4.9% 到 -20.1%；group prefill -14.0%；decode 1-token 档观测到 +3.0% 到 +11.0%；MC2 回退路径 g256@512 观测到 +25.5%，该读数受宿主负载影响，需复测。</desc>
  <style>
    .surf { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .ink2 { fill: #52514e; } .mut { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; } .bline { stroke: #c3c2b7; stroke-width: 1; }
    .s1 { fill: #2a78d6; } .s3 { fill: #1baf7a; } .neg { fill: #e34948; }
    text { font-family: 'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Segoe UI',Arial,sans-serif; }
    @media (prefers-color-scheme: dark) {
      .surf { fill: #1a1a19; } .ink { fill: #ffffff; } .ink2 { fill: #c3c2b7; } .mut { fill: #898781; }
      .grid { stroke: #2c2c2a; } .bline { stroke: #383835; }
      .s1 { fill: #3987e5; } .s3 { fill: #199e70; } .neg { fill: #e66767; }
    }
  </style>
  <rect class="surf" x="0" y="0" width="880" height="490"/>
  <text class="ink" x="24" y="30" font-size="15" font-weight="600">最终版分档收益与回退风险（vs 基线，NPUGraph）</text>
  <text class="ink2" x="24" y="48" font-size="12">负值 = 变快。蓝：共享专家主路径；绿：MoE group 路径；红：观测到的回退</text>

  <!-- x axis: -25% .. +30%, zero at x=464, 10.18 px/% -->
  <line class="grid" x1="159.5" y1="70" x2="159.5" y2="430"/>
  <text class="mut" x="159.5" y="446" font-size="11" text-anchor="middle">-30%</text>
  <line class="grid" x1="311.8" y1="70" x2="311.8" y2="430"/>
  <text class="mut" x="311.8" y="446" font-size="11" text-anchor="middle">-15%</text>
  <line class="bline" x1="464" y1="70" x2="464" y2="430"/>
  <text class="ink2" x="464" y="446" font-size="11" text-anchor="middle" font-weight="600">0</text>
  <line class="grid" x1="616.3" y1="70" x2="616.3" y2="430"/>
  <text class="mut" x="616.3" y="446" font-size="11" text-anchor="middle">+15%</text>
  <line class="grid" x1="768.5" y1="70" x2="768.5" y2="430"/>
  <text class="mut" x="768.5" y="446" font-size="11" text-anchor="middle">+30%</text>

  <!-- bars: 14 rows, y 78..422 step 25, height 15, zero-anchored -->
  <rect class="s1" x="259.4" y="78" width="204.6" height="15" rx="2"/>
  <text class="ink2" x="254" y="90" font-size="11" text-anchor="end">2H=4096 @4096</text>
  <text class="ink2" x="470" y="90" font-size="11" font-weight="600">-20.1%</text>

  <rect class="s1" x="284.9" y="103" width="179.1" height="15" rx="2"/>
  <text class="ink2" x="279" y="115" font-size="11" text-anchor="end">2H=4096 @2048</text>
  <text class="ink2" x="470" y="115" font-size="11" font-weight="600">-17.6%</text>

  <rect class="s1" x="308.2" y="128" width="155.8" height="15" rx="2"/>
  <text class="ink2" x="303" y="140" font-size="11" text-anchor="end">2H=4096 @1024</text>
  <text class="ink2" x="470" y="140" font-size="11" font-weight="600">-15.3%</text>

  <rect class="s1" x="337.8" y="153" width="126.2" height="15" rx="2"/>
  <text class="ink2" x="313" y="165" font-size="11" text-anchor="end">2H=4096 @512</text>
  <text class="ink2" x="470" y="165" font-size="11" font-weight="600">-12.4%</text>

  <rect class="s3" x="321.5" y="178" width="142.5" height="15" rx="2"/>
  <text class="ink2" x="316" y="190" font-size="11" text-anchor="end">g64 @2048（group）</text>
  <text class="ink2" x="470" y="190" font-size="11" font-weight="600">-14.0%</text>

  <rect class="s1" x="335.7" y="203" width="128.3" height="15" rx="2"/>
  <text class="ink2" x="330" y="215" font-size="11" text-anchor="end">2H=1024 @4096</text>
  <text class="ink2" x="470" y="215" font-size="11" font-weight="600">-12.6%</text>

  <rect class="s1" x="346.9" y="228" width="117.1" height="15" rx="2"/>
  <text class="ink2" x="341" y="240" font-size="11" text-anchor="end">2H=2048 @4096</text>
  <text class="ink2" x="470" y="240" font-size="11" font-weight="600">-11.5%</text>

  <rect class="s1" x="380.4" y="253" width="83.6" height="15" rx="2"/>
  <text class="ink2" x="375" y="265" font-size="11" text-anchor="end">2H=2048 @2048</text>
  <text class="ink2" x="470" y="265" font-size="11" font-weight="600">-8.1%</text>

  <rect class="s1" x="414.0" y="278" width="50.0" height="15" rx="2"/>
  <text class="ink2" x="409" y="290" font-size="11" text-anchor="end">2H=512 @4096</text>
  <text class="ink2" x="470" y="290" font-size="11" font-weight="600">-4.9%</text>

  <rect class="neg" x="464" y="303" width="30.5" height="15" rx="2"/>
  <text class="ink2" x="458" y="315" font-size="11" text-anchor="end">2H=4096 T=1（decode）</text>
  <text class="ink2" x="502" y="315" font-size="11" font-weight="600">+3.0%</text>

  <rect class="neg" x="464" y="328" width="100.8" height="15" rx="2"/>
  <text class="ink2" x="458" y="340" font-size="11" text-anchor="end">2H=2048 T=1</text>
  <text class="ink2" x="573" y="340" font-size="11" font-weight="600">+9.9%</text>

  <rect class="neg" x="464" y="353" width="111.0" height="15" rx="2"/>
  <text class="ink2" x="458" y="365" font-size="11" text-anchor="end">2H=1024 T=1</text>
  <text class="ink2" x="583" y="365" font-size="11" font-weight="600">+10.9%</text>

  <rect class="neg" x="464" y="378" width="111.9" height="15" rx="2"/>
  <text class="ink2" x="458" y="390" font-size="11" text-anchor="end">2H=512 T=1</text>
  <text class="ink2" x="584" y="390" font-size="11" font-weight="600">+11.0%</text>

  <rect class="neg" x="464" y="403" width="259.6" height="15" rx="2"/>
  <text class="ink2" x="458" y="415" font-size="11" text-anchor="end">g256 @512（MC2 回退路径）</text>
  <text class="ink2" x="732" y="415" font-size="11" font-weight="600">+25.5%*</text>

  <text class="mut" x="24" y="472" font-size="10.5">* 负载敏感读数：同日宿主 loadavg 33→123 时该档 +11%~+25.5% 漂移；原因尚未隔离，需受控复测。</text>
  <text class="mut" x="24" y="486" font-size="10.5">图中列出代表性形状；其他形状需分别核对，不能将中档合并判断。数据：NPUGraph，5 样本中位。</text>
</svg>
